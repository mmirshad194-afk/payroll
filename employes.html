<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Employees</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
  <div class="sidebar"> <img src="Logo White.png"> <a href="index.html">Dashboard</a> <a href="employes.html"
      class="active">Employees</a> <a href="attendence.html">Attendance</a> <a href="earnings.html">Earnings</a> <a
      href="deduction.html">Deductions</a> <a href="payroll.html">Payroll</a> </div>
  <div class="content">
    <h1>Employees</h1> <button class="add-btn" onclick="openModal()">+ Add Employees</button>
    <table class="employee-table" id="employeeTable">
      <thead>
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>email</th>
          <th>Department</th>
          <th>Salary Type</th>
          <th>Joining Date</th>
          <th>Status</th>
          <th>Action</th>
         
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="modal" id="employeeModal">
    <div class="modal-content"> <span class="close" onclick="closeModal()">&times;</span>
      <h2>Add Employee</h2>
      <div class="form-group"> <label>Employee ID</label> <input type="text" id="employeeId" readonly
          style="background:#f0f0f0; cursor:not-allowed;"> </div>
      <div class="form-group"> <label>Name</label> <input type="text" id="name" placeholder="Enter employee name">
      </div>
      <div class="form-group"> <label>Email</label> <input type="email" id="email" placeholder="Enter Your Email">
      </div>
      <div class="form-group"> <label>Department</label> <input type="text" id="department"
          placeholder="Enter department"> </div>
      <div class="form-group"> <label>Salary Type</label> <input type="text" id="salaryType"
          placeholder="Monthly / Daily"> </div>
      <div class="form-group"> <label>Joining Date</label> <input type="date" id="joiningDate"> </div>
      <div class="form-group"> <label>Status</label> <select id="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select> </div> <button class="btn-primary" onclick="saveEmployee()">Save Employee</button>
    </div>
  </div>
  <script src="employees.js"></script>
</body>

</html>
