<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Payroll System</title>

<link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-wrapper">

  <div class="login-card">

    <h2>Welcome Back</h2>

    <p>Login to continue to Payroll Dashboard</p>

    <img src="NewLogoIQ.png"
         class="login-image"
         alt="Logo">

    <form id="loginForm">

      <div class="form-group">

        <label>Email</label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          required>

      </div>

      <div class="form-group">

        <label>Password</label>

        <div class="password-wrapper">

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required>

          <a href="forgott.html" class="forgot-link">
            Forgot password?
          </a>

        </div>

      </div>

      <button class="btn-primary" type="submit">
        Login
      </button>

      <p class="create-account">

        Don’t have an account?

        <a href="signup.html">
          Create Account
        </a>

      </p>

    </form>

  </div>

</div>

<script src="login.js"></script>

</body>
</html>
