<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Payroll System</title>
<link rel="stylesheet" href="style.css">

<script>
  const isLoggedIn = localStorage.getItem("loggedIn");

  if (isLoggedIn !== "true") {
    window.location.replace("login.html");
  }
</script>

</head>

<body>

<div class="sidebar">
  <img src="Logo White.png">

  <a href="index.html" class="active">Dashboard</a>
  <a href="employes.html">Employees</a>
  <a href="attendence.html">Attendance</a>
  <a href="earnings.html">Earnings</a>
  <a href="deduction.html">Deductions</a>
  <a href="payroll.html">Payroll</a>
</div>

<div class="topbar-user">

  <img src="3135715.png"
       alt="User Logo"
       class="user-logo"
       onclick="toggleUserDropdown()">

  <div class="user-dropdown">

    <div class="user-info">
      <strong>John Doe</strong>
      <p>Admin</p>
    </div>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>
</div>

<div class="content">

  <h1>Dashboard</h1>

  <div class="grid">

    <div class="card">
      Total Employees: <strong>12</strong>
    </div>

    <div class="card">
      Monthly Payroll: <strong>₹50000</strong>
    </div>

    <div class="card">
      Pending Leaves: <strong>4</strong>
    </div>

  </div>

</div>

<script>

function toggleUserDropdown() {

  const dropdown = document.querySelector('.user-dropdown');
  dropdown.classList.toggle('show');

}

function logout() {

  localStorage.removeItem("loggedIn");

  window.location.replace("login.html");

}

window.addEventListener('click', function(e) {

  const dropdown = document.querySelector('.user-dropdown');

  const userLogo = document.querySelector('.user-logo');

  if (!dropdown.contains(e.target) && e.target !== userLogo) {

    dropdown.classList.remove('show');

  }

});

</script>

</body>
</html>
