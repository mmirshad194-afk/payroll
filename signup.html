<!-- signup.html -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-wrapper">
    
    <div class="login-card">

        <img src="Logo White.png" class="login-image" alt="Logo">

        <h2>Create New Account</h2>
        <p>Register to access Payroll System</p>

        <form id="signupForm">

            <label>Username</label>
            <input type="text" id="name" placeholder="Enter username" required>

            <label>Phone No</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>

            <label>Batch</label>
            <input type="text" id="batch" placeholder="Enter Batch" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit" class="btn-primary">Sign Up</button>

        </form>

        <div class="login-links">
            <a href="index.html">Back to Login</a>
        </div>

    </div>

</div>

<script src="signup.js"></script>

</body>
</html>
